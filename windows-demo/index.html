          },
          failed: failed,
          report: function () { return JSON.parse(JSON.stringify(report)); }
        };
        document.getElementById('sig-assist-startup-retry').addEventListener('click', function () { location.reload(); });
        document.getElementById('sig-assist-startup-export').addEventListener('click', async function () {
          report.exportedAt = new Date().toISOString();
          try { report.browserStorage = { available: true, keyCount: localStorage.length }; }
          catch (error) { report.browserStorage = { available: false, error: String(error.message) }; }
          var metadata = document.getElementById('sig-assist-connector-startup');
          if (metadata) report.connectorStartup = JSON.parse(metadata.textContent);
          if (location.protocol === 'http:' && ['127.0.0.1', 'localhost'].includes(location.hostname)) {
            try {
              var controller = new AbortController(); var timeout = setTimeout(function () { controller.abort(); }, 2000);
              try {
                var response = await fetch('/connector/diagnostics', { signal: controller.signal });
                if (response.ok) report.connector = await response.json(); else report.connectorError = 'HTTP ' + response.status;
              } finally { clearTimeout(timeout); }
            } catch (error) { report.connectorError = String(error.message); }
          }
          var url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
          var link = document.createElement('a'); link.href = url; link.download = 'sig-assist-startup-' + report.exportedAt.replace(/[:.]/g, '-') + '.json';
          document.body.appendChild(link); link.click(); link.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        });
        document.addEventListener('DOMContentLoaded', function () {
          var dismiss = document.getElementById('sig-assist-dismiss-port-notice');
          if (dismiss) dismiss.addEventListener('click', function () { document.getElementById('sig-assist-port-notice').remove(); });
        });
      }());
    </script>
  </body>
</html>
