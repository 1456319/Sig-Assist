name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'Windows'
        run: node scripts/package-windows.mjs
      - if: runner.os == 'Windows'
        run: npm run demo:test
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sig-Assist-Windows-Demo
          path: windows-demo/
          if-no-files-found: error
