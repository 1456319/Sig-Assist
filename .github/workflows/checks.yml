name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:demo
      - run: python scripts/package-demo.py --check
      - name: Verify committed portable build matches source
        run: git diff --exit-code -- windows-demo/index.html
      - name: Package and test existing Windows launcher
        if: runner.os == 'Windows'
        run: node scripts/package-windows.mjs
      - if: runner.os == 'Windows'
        run: npm run demo:test
      - name: Smoke test Windows PowerShell launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - name: Verify CMD launchers from UNC shares without Node.js
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-unc-launchers.ps1
      - name: Verify actual Windows Edge demo workflow and clipboard
        if: runner.os == 'Windows'
        run: node scripts/smoke-browser.mjs
      - name: Upload portable Windows demo
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sig-Assist-Windows-Demo
          path: windows-demo/Sig-Assist-Windows-Demo.zip
