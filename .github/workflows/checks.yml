name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify user-only Node download, cache and connector startup without Node on PATH
        if: runner.os == 'Windows'
        run: node scripts/smoke-node-bootstrap.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - name: Verify Framework desktop detection and transfer against synthetic Windows controls
        if: runner.os == 'Windows'
        run: node scripts/smoke-framework-desktop.mjs
      - name: Verify clinical codes match the root reference
        run: python scripts/generate-clinical-code-reference.py --check
      - run: npm run build:demo
      - run: python scripts/package-demo.py --check
      - name: Verify committed portable build matches source
        run: git diff --exit-code -- windows-demo/index.html
      - name: Package and test existing Windows launcher
        if: runner.os == 'Windows'
        run: node scripts/package-windows.mjs
      - if: runner.os == 'Windows'
        run: npm run demo:test
      - name: Smoke test Windows PowerShell launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - name: Verify browser launchers and direct UNC file workflow
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-unc-launchers.ps1
      - name: Verify actual Windows Edge demo workflow and clipboard
        if: runner.os == 'Windows'
        run: node scripts/smoke-browser.mjs
      - name: Verify direct-file Edge workflow without a script server
        if: runner.os == 'Windows'
        run: node scripts/smoke-browser.mjs --file
      - name: Verify Iguana capture import and read-only localhost bridge in Edge
        if: runner.os == 'Windows'
        run: node scripts/smoke-iguana.mjs
      - name: Upload portable Windows demo
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sig-Assist-Windows-Demo
          path: windows-demo/Sig-Assist-Windows-Demo.zip
